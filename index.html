<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Antrian Charger Motor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f3f6fb;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,.08);
    text-align: center;
  }

  h2 { margin-bottom: 20px; }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }

  .btn-primary { background: #2563eb; color: white; }
  .btn-danger { background: #ef4444; color: white; margin-top: 12px; }

  .info { margin-top: 16px; font-size: 15px; line-height: 1.6; }

  .status { margin-top: 12px; font-weight: bold; font-size: 18px; }
  .wait { color: #64748b; }
  .ready { color: #f59e0b; }
  .now { color: #16a34a; }

  .popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .popup-box {
    background: white;
    padding: 20px;
    border-radius: 14px;
    width: 280px;
    text-align: center;
  }
</style>
</head>

<body>

<div class="card">
  <h2>🔌 Antrian Charger Motor</h2>

  <div id="form">
    <input id="name" placeholder="Nama">
    <input id="plate" placeholder="Plat Nomor (B 1234 ABC)">
    <button class="btn-primary" onclick="ambilAntrian()">Ambil Antrian</button>
  </div>

  <div id="result" style="display:none">
    <div class="info" id="info"></div>
    <div class="status wait" id="status"></div>
    <button class="btn-danger" onclick="resetLocal()">Ambil Ulang</button>
  </div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3>✅ Berhasil</h3>
    <p>Antrian berhasil diambil</p>
    <button class="btn-primary" onclick="closePopup()">OK</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
/* ========== FIREBASE ========== */
firebase.initializeApp({
  apiKey: "AIzaSyCIdveFrv0s1sD4N1sID8x0DH2RKgo5LJg",
  authDomain: "queue-charge.firebaseapp.com",
  projectId: "queue-charge"
});
const db = firebase.firestore();

/* ========== STATE ========== */
let myNumber = Number(localStorage.getItem("queue_number"));
let notified = localStorage.getItem("queue_notified") === "true";

/* ========== INIT ========== */
init();
requestNotificationPermission();

function init() {
  if (myNumber) {
    renderInfo("-");
    listenStatus();
  }
}

/* ========== NOTIFICATION ========== */
function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function pushNotification() {
  if (!("Notification" in window)) return;
  if (Notification.permission !== "granted") return;
  if (notified) return;

  new Notification("🔌 Giliran Kamu!", {
    body: "Sekarang giliran kamu untuk charging motor.",
    icon: "https://cdn-icons-png.flaticon.com/512/1046/1046784.png"
  });

  localStorage.setItem("queue_notified", "true");
  notified = true;
}

/* ========== UI RENDER ========== */
function renderInfo(current) {
  document.getElementById("form").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("info").innerHTML = `
    Nama: <b>${localStorage.getItem("queue_name")}</b><br>
    Plat: <b>${localStorage.getItem("queue_plate")}</b><br><br>
    Nomor Kamu: <b>#${myNumber}</b><br>
    Sekarang: <b>${current}</b>
  `;
}

/* ========== AMBIL ANTRIAN ========== */
async function ambilAntrian() {
  const name = nameInput.value.trim();
  const plate = plateInput.value.trim().toUpperCase();
  if (!name || !plate) return alert("Nama dan plat wajib diisi");

  const snap = await db.collection("queue").orderBy("number","desc").limit(1).get();
  myNumber = snap.empty ? 1 : snap.docs[0].data().number + 1;

  await db.collection("queue").add({
    number: myNumber, name, plate,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  localStorage.setItem("queue_number", myNumber);
  localStorage.setItem("queue_name", name);
  localStorage.setItem("queue_plate", plate);
  localStorage.removeItem("queue_notified");

  showPopup();
  renderInfo("...");
  listenStatus();
}

/* ========== REALTIME STATUS ========== */
function listenStatus() {
  db.collection("meta").doc("state").onSnapshot(doc => {
    if (!doc.exists || !myNumber) return;

    const current = doc.data().current;
    let text = "MENUNGGU", cls = "wait";

    if (myNumber === current) {
      text = "SEKARANG 🔌";
      cls = "now";
      pushNotification(); // 🔥 PUSH DI SINI
    } else if (myNumber === current + 1) {
      text = "BERSIAP ⚠️";
      cls = "ready";
    }

    renderInfo(current);
    const s = status;
    s.className = "status " + cls;
    s.innerText = text;
  });
}

/* ========== UTIL ========== */
function resetLocal() {
  if (!confirm("Ambil antrian ulang?")) return;
  localStorage.clear();
  location.reload();
}
function showPopup(){ popup.style.display="flex"; }
function closePopup(){ popup.style.display="none"; }
</script>

</body>
</html>
