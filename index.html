<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Charger Motor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --primary:#2563eb;
  --success:#16a34a;
  --warning:#f59e0b;
  --danger:#ef4444;
  --text:#0f172a;
  --muted:#64748b;
  --bg:#f1f5f9;
  --border:#e2e8f0;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(1000px 400px at 10% -10%, #dbeafe, transparent),
    radial-gradient(800px 300px at 90% 10%, #e0f2fe, transparent),
    var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.app{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}

/* HEADER */
.header{text-align:center;margin-bottom:24px}
.header h1{margin:0 0 6px;font-size:22px}
.header p{margin:0;font-size:14px;color:var(--muted)}

/* FORM */
.field{margin-bottom:14px}
.label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--border);
  font-size:15px;
}
input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

/* BUTTON */
button{
  width:100%;
  padding:15px;
  border-radius:16px;
  border:none;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}
.btn-primary{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
}
.btn-success{
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:white;
}
.btn-disabled{
  background:#e5e7eb;
  color:#9ca3af;
  cursor:not-allowed;
}

/* INFO CARD */
.card-info{
  background:#f8fafc;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.card-info div{font-size:15px;margin-bottom:6px}

/* STATUS */
.status{
  padding:16px;
  border-radius:18px;
  font-size:18px;
  font-weight:800;
  text-align:center;
}
.wait{background:#f1f5f9;color:var(--muted)}
.ready{background:#fef3c7;color:var(--warning)}
.now{background:#dcfce7;color:var(--success)}

.hidden{display:none}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🔌 Charger Motor</h1>
    <p>Ambil antrian & tunggu giliran kamu</p>
  </div>

  <!-- FORM -->
  <div id="form">
    <div class="field">
      <label class="label">Nama</label>
      <input id="name" placeholder="Masukkan nama">
    </div>
    <div class="field">
      <label class="label">Plat Nomor</label>
      <input id="plate" placeholder="B 1234 ABC">
    </div>
    <button class="btn-primary" onclick="ambilAntrian()">Ambil Antrian</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="card-info" id="info"></div>
    <div class="status wait" id="statusBox"></div>
    <button id="finishBtn" class="btn-success hidden" onclick="selesaiMengisi()">
      Selesai Mengisi
    </button>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCIdveFrv0s1sD4N1sID8x0DH2RKgo5LJg",
  authDomain:"queue-charge.firebaseapp.com",
  projectId:"queue-charge"
});
const db=firebase.firestore();

let myNumber=Number(localStorage.getItem("queue_number"));

if(myNumber){
  showResult("-");
  listenStatus();
}

async function ambilAntrian(){
  const name=document.getElementById("name").value.trim();
  const plate=document.getElementById("plate").value.trim().toUpperCase();
  if(!name||!plate)return alert("Nama & plat wajib diisi");

  const snap=await db.collection("queue").get();
  myNumber=snap.docs.length+1;

  await db.collection("queue").add({
    number:myNumber,name,plate,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  localStorage.setItem("queue_number",myNumber);
  localStorage.setItem("queue_name",name);
  localStorage.setItem("queue_plate",plate);

  showResult("...");
  listenStatus();
}

function showResult(current){
  form.style.display="none";
  result.classList.remove("hidden");

  info.innerHTML=`
    <div>Nama: <b>${localStorage.getItem("queue_name")}</b></div>
    <div>Plat: <b>${localStorage.getItem("queue_plate")}</b></div>
    <div>Nomor Antrian: <b>#${myNumber}</b></div>
    <div>Sekarang: <b>${current}</b></div>
  `;
}

function listenStatus(){
  db.collection("meta").doc("state").onSnapshot(doc=>{
    if(!doc.exists)return;
    const current=doc.data().current;

    let text="MENUNGGU";
    let cls="wait";

    finishBtn.classList.add("hidden");

    if(myNumber===current){
      text="SEKARANG GILIRAN KAMU 🔌";
      cls="now";
      finishBtn.classList.remove("hidden");
    }else if(myNumber===current+1){
      text="BERSIAP ⚠️";
      cls="ready";
    }

    showResult(current);
    statusBox.className="status "+cls;
    statusBox.innerText=text;
  });
}

/* === SELESAI MENGISI (NEXT) === */
async function selesaiMengisi(){
  const ref=db.collection("meta").doc("state");
  const snap=await ref.get();
  const current=snap.exists?snap.data().current:0;
  await ref.set({current:current+1});

  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
