<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Charger Motor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --primary:#2563eb;
  --success:#16a34a;
  --warning:#f59e0b;
  --muted:#64748b;
  --bg:#f1f5f9;
  --border:#e2e8f0;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Segoe UI,system-ui,sans-serif;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.app{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}
.header{text-align:center;margin-bottom:20px}
.header h1{margin:0;font-size:22px}
.header p{margin:6px 0 0;color:var(--muted);font-size:14px}

.field{margin-bottom:14px}
.label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--border);
  font-size:15px;
}

button{
  width:100%;
  padding:15px;
  border-radius:16px;
  border:none;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}
.btn-primary{background:#2563eb;color:white}
.btn-success{background:#16a34a;color:white}
.btn-disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}

.card{
  background:#f8fafc;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.status{
  padding:16px;
  border-radius:18px;
  font-size:18px;
  font-weight:800;
  text-align:center;
}
.wait{background:#f1f5f9;color:var(--muted)}
.ready{background:#fef3c7;color:var(--warning)}
.now{background:#dcfce7;color:var(--success)}
.done{background:#e5e7eb;color:#475569}

.hidden{display:none}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h1>🔌 Charger Motor</h1>
    <p>Antrian pengisian</p>
  </div>

  <!-- FORM -->
  <div id="form">
    <div class="field">
      <label class="label">Nama</label>
      <input id="name">
    </div>
    <div class="field">
      <label class="label">Plat Nomor</label>
      <input id="plate">
    </div>
    <button class="btn-primary" onclick="ambilAntrian()">Ambil Antrian</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="card" id="info"></div>
    <div class="status wait" id="statusBox"></div>
    <button id="finishBtn" class="btn-success hidden" onclick="selesaiMengisi()">
      Selesai Mengisi
    </button>
    <button id="lockedBtn" class="btn-disabled hidden">
      Hanya bisa diselesaikan di device awal
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCIdveFrv0s1sD4N1sID8x0DH2RKgo5LJg",
  authDomain:"queue-charge.firebaseapp.com",
  projectId:"queue-charge"
});
const db=firebase.firestore();

/* DEVICE LOCK */
let deviceId = localStorage.getItem("device_id");
if(!deviceId){
  deviceId = crypto.randomUUID();
  localStorage.setItem("device_id", deviceId);
}

let myNumber = Number(localStorage.getItem("queue_number"));

if(myNumber){
  showResult("-");
  listenStatus();
}

async function ambilAntrian(){
  const name=document.getElementById("name").value.trim();
  const plate=document.getElementById("plate").value.trim().toUpperCase();
  if(!name||!plate) return alert("Nama & plat wajib diisi");

  const snap=await db.collection("queue").get();
  myNumber=snap.docs.length+1;

  await db.collection("queue").add({
    number:myNumber,name,plate,deviceId,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  localStorage.setItem("queue_number",myNumber);
  localStorage.setItem("queue_name",name);
  localStorage.setItem("queue_plate",plate);

  showResult("...");
  listenStatus();
}

function showResult(current){
  form.style.display="none";
  result.classList.remove("hidden");
  info.innerHTML=`
    Nama: <b>${localStorage.getItem("queue_name")}</b><br>
    Plat: <b>${localStorage.getItem("queue_plate")}</b><br>
    Nomor: <b>#${myNumber}</b><br>
    Sekarang: <b>${current}</b>
  `;
}

function listenStatus(){
  db.collection("meta").doc("state").onSnapshot(async doc=>{
    if(!doc.exists) return;
    const current=doc.data().current;

    finishBtn.classList.add("hidden");
    lockedBtn.classList.add("hidden");

    let text="MENUNGGU";
    let cls="wait";

    if(myNumber < current){
      text="SELESAI ✅";
      cls="done";
    }
    else if(myNumber === current){
      text="SEKARANG GILIRAN KAMU 🔌";
      cls="now";

      const qSnap = await db.collection("queue")
        .where("number","==",myNumber).limit(1).get();

      if(!qSnap.empty && qSnap.docs[0].data().deviceId===deviceId){
        finishBtn.classList.remove("hidden");
      }else{
        lockedBtn.classList.remove("hidden");
      }
    }
    else if(myNumber === current+1){
      text="BERSIAP ⚠️";
      cls="ready";
    }

    showResult(current);
    statusBox.className="status "+cls;
    statusBox.innerText=text;
  });
}

async function selesaiMengisi(){
  const ref=db.collection("meta").doc("state");
  const snap=await ref.get();
  const current=snap.exists?snap.data().current:0;
  await ref.set({current:current+1});

  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
