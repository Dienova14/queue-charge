<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Antrian Charger Motor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      padding: 20px;
      text-align: center;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .status {
      font-size: 18px;
      margin-top: 10px;
      font-weight: bold;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

  </style>
</head>
<body>

<div class="box">
  <h2>🔌 Antrian Charger Motor</h2>

  <input id="name" placeholder="Nama" />
  <input id="plate" placeholder="Plat Nomor (B 1234 ABC)" />

  <button onclick="ambilAntrian()">Ambil Antrian</button>

  <p id="info">Belum ambil antrian</p>
  <div class="status" id="status"></div>
</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCIdveFrv0s1sD4N1sID8x0DH2RKgo5LJg",
  authDomain: "queue-charge.firebaseapp.com",
  projectId: "queue-charge",
  storageBucket: "queue-charge.firebasestorage.app",
  messagingSenderId: "1057500450444",
  appId: "1:1057500450444:web:d1bea6286d1b283408f5a9",
  measurementId: "G-QG2W06WJXT"
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const deviceId = localStorage.getItem("device_id") || (() => {
    const id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
    return id;
  })();

  let myNumber = localStorage.getItem("queue_number");

  async function ambilAntrian() {
  if (myNumber && myNumber > 0) return;

  const name = document.getElementById("name").value.trim();
  const plate = document.getElementById("plate").value.trim();

  if (!name || !plate) {
    alert("Nama dan plat nomor wajib diisi");
    return;
  }

  const snap = await db
    .collection("queue")
    .orderBy("number", "desc")
    .limit(1)
    .get();

  const last = snap.empty ? 0 : snap.docs[0].data().number;
  myNumber = last + 1;

  await db.collection("queue").add({
    number: myNumber,
    name: name,
    plate: plate.toUpperCase(),
    deviceId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  localStorage.setItem("queue_number", myNumber);

  document.getElementById("name").disabled = true;
  document.getElementById("plate").disabled = true;
}

</script>

</body>
</html>
