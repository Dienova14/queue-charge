<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Charger Motor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Inter,system-ui;background:#f1f5f9;display:flex;justify-content:center}
.app{background:#fff;padding:24px;border-radius:20px;width:100%;max-width:420px;margin-top:40px}
button{padding:14px;border-radius:14px;border:none;background:#2563eb;color:#fff;font-weight:600;width:100%}
.status{margin-top:14px;padding:14px;border-radius:14px;font-weight:700;text-align:center}
.now{background:#dcfce7;color:#16a34a}
.wait{background:#e5e7eb}
.hidden{display:none}
</style>
</head>
<body>

<div class="app">
  <h2>🔌 Charger Motor</h2>

  <div id="form">
    <input id="name" placeholder="Nama"><br><br>
    <input id="plate" placeholder="Plat Nomor"><br><br>
    <button onclick="ambil()">Ambil Antrian</button>
  </div>

  <div id="result" class="hidden">
    <div id="info"></div>
    <div id="status" class="status wait"></div>
    <button id="finish" class="hidden" onclick="selesai()">Selesai</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCIdveFrv0s1sD4N1sID8x0DH2RKgo5LJg",
  projectId:"queue-charge"
});
const db=firebase.firestore();

let deviceId=localStorage.deviceId||(localStorage.deviceId=crypto.randomUUID());
let myNumber=+localStorage.queue_number;
let mySlot=localStorage.queue_slot;

if(myNumber) listen();

async function ambil(){
  const name=nameInput.value.trim();
  const plate=plateInput.value.trim();
  if(!name||!plate)return alert("Lengkapi data");

  const meta=await db.collection("meta").doc("state").get();
  const slots=meta.data().slots;

  // cari slot kosong
  let slot=Object.keys(slots).find(s=>slots[s].current===0);
  if(!slot) slot="A"; // fallback

  const qSnap=await db.collection("queue").get();
  myNumber=qSnap.docs.length+1;
  mySlot=slot;

  await db.collection("queue").add({
    number:myNumber,name,plate,slot,deviceId
  });

  if(slots[slot].current===0){
    await db.collection("meta").doc("state")
      .update({[`slots.${slot}.current`]:myNumber});
  }

  localStorage.queue_number=myNumber;
  localStorage.queue_slot=mySlot;

  listen();
}

function listen(){
  form.classList.add("hidden");
  result.classList.remove("hidden");

  db.collection("meta").doc("state").onSnapshot(async d=>{
    const current=d.data().slots[mySlot].current;

    if(myNumber<current){
      localStorage.clear();
      location.reload();
      return;
    }

    info.innerHTML=`Nomor #${myNumber}<br>Slot ${mySlot}`;
    finish.classList.add("hidden");

    if(myNumber===current){
      status.innerText="SEKARANG GILIRAN KAMU";
      status.className="status now";
      finish.classList.remove("hidden");
    }else{
      status.innerText="MENUNGGU";
      status.className="status wait";
    }
  });
}

async function selesai(){
  const ref=db.collection("meta").doc("state");
  const snap=await ref.get();
  const cur=snap.data().slots[mySlot].current;
  await ref.update({[`slots.${mySlot}.current`]:cur+1});
  localStorage.clear();
  location.reload();
}

const nameInput=document.getElementById("name");
const plateInput=document.getElementById("plate");
</script>
</body>
</html>
